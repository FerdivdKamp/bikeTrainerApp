[project]
name = "ergtrainer-csv-reader"
version = "0.1.0"
description = "Jupyter tools for inspecting ErgTrainer recording CSV files."
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=8.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[tool.ruff]
line-length = 100
